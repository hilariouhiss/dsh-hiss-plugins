# @hilariouhiss/dsh-openspec bundle patch: one self-referencing host row.
#
# `dsh plugin --profile <name> add @hilariouhiss/dsh-openspec` installs this
# package into the profile; because it declares `dsh.bundle.patch`, the profile
# manifest appends it to the bundle list, and this patch is applied as a layer
# on boot. The row resolves `@hilariouhiss/dsh-openspec` from the profile's own
# node_modules, so the plugin's `apply(ctx)` runs in the host plane: its skill
# provider registers into the global `skills` layer (visible to every agent
# preset), its system-prompt section and `/opsx-*` commands register globally.
- insert:
    - id: openspec
      name: '@hilariouhiss/dsh-openspec'
