# @hilariouhiss/dsh-taste-skill bundle patch: one self-referencing host row.
#
# `dsh plugin --profile <name> add @hilariouhiss/dsh-taste-skill` installs this
# package into the profile; because it declares `dsh.bundle.patch`, the profile
# manifest appends it to the bundle list, and this patch is applied as a layer
# on boot. The row resolves `@hilariouhiss/dsh-taste-skill` from the profile's
# own node_modules, so the plugin's `apply(ctx)` runs in the host plane: its
# skill provider registers into the global `skills` layer, making the 13
# vendored taste skills visible to every agent preset and every session.
- insert:
    - id: taste-skill
      name: '@hilariouhiss/dsh-taste-skill'
